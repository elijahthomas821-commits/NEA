# Secret scanning configuration (used by CI).
title = "resale-sourcing gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known, already-disclosed secrets in the legacy FlaskProject (rotate them - see README) and test fixtures"
paths = [
    '''^FlaskProject/''',
    '''^tests/''',
    '''\.env\.example$''',
]
