# Brand catalogue seed. Brands are data, not code: add or edit brands here (then run
# `resale seed`) or through the API.
#
# aliases           phrases that identify the brand in a brand field, title or description
#                   (matched after normalisation: lower-case, accents and punctuation removed,
#                   so "C.P. Company" and "cp company" are the same alias).
# negative_aliases  phrases that mention the brand but mean "not this brand" (style/inspired
#                   wording). Generic replica wording ("replica", "1:1", ...) is in
#                   identification.yaml and applies to every brand.
# base_authenticity_risk
#                   prior counterfeit risk for the brand on second-hand marketplaces (0-1).
#                   PLACEHOLDER judgement values - adjust from your own experience.

brands:
  - name: Stone Island
    slug: stone-island
    base_authenticity_risk: "0.35"
    aliases:
      - stone island
      - stoneisland
      - stone-island
      - stone islnd
      - stone iland
      - stone isalnd
      - stoney island
    negative_aliases:
      - stone island style
      - stone island inspired
      - stone island type
      - stone island badge only
      - badge only
      - not stone island
      - stone island look

