# Canonical products used for matching listings to comparable sales.
#
# level: model | product_line. A "brand_category_generic" product is created automatically
# for every brand x in-scope category, so any listing with a known brand and category can
# still match (at low confidence) when no specific product fits.
#
# aliases: phrases that point to the product, with an optional weight (0-1, default 1.0).
# Keep aliases specific: "crinkle reps" identifies a product, "nylon" does not.
# These entries are identification aids only - they contain no prices.

